/* light/dark: "system" (default) follows the device; choice saved per browser */
(function () {
  var pick = "system"; try { pick = localStorage.getItem("ns_theme") || "system"; } catch (e) {}
  var mq = window.matchMedia ? matchMedia("(prefers-color-scheme: light)") : null;
  function apply(p) {
    var t = p === "system" ? (mq && mq.matches ? "light" : "dark") : p;
    document.documentElement.dataset.theme = t; document.documentElement.dataset.themePick = p;
    var m = document.querySelector('meta[name="theme-color"]'); if (m) m.content = t === "light" ? "#F6F6F3" : "#0E0F12";
    document.querySelectorAll("[data-theme-btn]").forEach(function (b) { b.setAttribute("aria-label", "Theme: " + p + " (switch)"); b.title = t === "light" ? "Switch to dark" : "Switch to light"; b.dataset.mode = t; });
    document.querySelectorAll("[data-theme-opt]").forEach(function (b) { b.classList.toggle("on", b.dataset.themeOpt === p); });
  }
  window.nsSetTheme = function (p) { try { localStorage.setItem("ns_theme", p); } catch (e) {} pick = p; apply(p); };
  window.nsToggleTheme = function () { nsSetTheme(document.documentElement.dataset.theme === "light" ? "dark" : "light"); };
  if (mq && mq.addEventListener) mq.addEventListener("change", function () { if (pick === "system") apply("system"); });
  apply(pick);
  document.addEventListener("DOMContentLoaded", function () { apply(pick); });
})();
</script>

<script src="/vendor/lightweight-charts.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const IS_ANDROID = /Android/i.test(navigator.userAgent || "");
// On Android, open the broker's app when it's installed and fall back to the website when it isn't
// (an intent link with the app's package and a browser fallback). iPhones use the plain link, which
// opens the app through the broker's universal links when the broker supports them.
const appHref = (url, pkg) => {
  if (!url || !IS_ANDROID) return url;
  const u = new URL(url);
  return `intent://${u.host}${u.pathname}${u.search}#Intent;scheme=https;package=${pkg};S.browser_fallback_url=${encodeURIComponent(url)};end`;
};
if (IS_ANDROID) document.addEventListener("click", (e) => {   // open intent links in place, not a blank new tab
  const a = e.target.closest && e.target.closest('a[href^="intent:"]');
  if (a) { e.preventDefault(); location.href = a.href; }
});
const rhUrl = (s) => appHref(`https://robinhood.com/stocks/${encodeURIComponent(s.toUpperCase())}`, "com.robinhood.android");
const wbUrl = (s, ex) => ex ? appHref(`https://www.webull.com/quote/${ex}-${encodeURIComponent(s.toLowerCase())}`, "org.dayup.stocks") : null;
const brokerLinks = (s, ex) => {
  const wb = wbUrl(s, ex);
  return `${wb ? `<a class="broker" href="${wb}" target="_blank" rel="noopener" title="Open ${esc(s)} in Webull" aria-label="Open ${esc(s)} in Webull"><img class="broker-logo" src="/vendor/webull-mark.png" alt="Webull" width="18" height="18"></a>` : ""}<a class="broker" href="${rhUrl(s)}" target="_blank" rel="noopener" title="Open ${esc(s)} in Robinhood" aria-label="Open ${esc(s)} in Robinhood"><img class="broker-logo" src="/vendor/robinhood.svg" alt="Robinhood" width="18" height="18"></a>`;
};
const money = (x) => x == null ? "–" : "$" + Number(x).toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2});
const pctFrom = (lvl, p) => { const v = (lvl / p - 1) * 100; return (v > 0 ? "+" : "") + v.toFixed(1) + "%"; };
const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const STATES = { forming: ["Inside hub", "--hub"], watching: ["Hub just ended", "--idle"], breakout_up: ["Breakout ↑", "--up"],
  breakdown: ["Breakdown ↓", "--down"], "follow-through": ["Hit shelf", "--ft"], "snap-back": ["Failed breakout", "--snap"],
  stalled: ["Timed out", "--stall"], none: ["Waiting for a hub", "--idle"] };
const SYM = decodeURIComponent(location.pathname.split("/").pop()).toUpperCase();
let TF = "4h", chart = null;
document.title = `${SYM} · NextShelf`;

function summary(st) {
  const p = st.last_close, h = st.hub, up = st.shelf_up, dn = st.shelf_down;
  const lvl = (sh, w) => sh ? `the next shelf is <b class="u-${w}">${money(sh.level)}</b> (${pctFrom(sh.level, p)})` : `there's no shelf ${w === "up" ? "above" : "below"} yet`;
  switch (st.state) {
    case "forming": return `${SYM} has held a tight range for <b>${h.sessions} sessions</b>. A 4H close <b class="u-up">above ${money(h.high)}</b>: ${lvl(up, "up")}. A 4H close <b class="u-down">below ${money(h.low)}</b>: ${lvl(dn, "down")}.`;
    case "watching": return `The range just ended without a breakout. A 4H close above ${money(h.high)} or below ${money(h.low)} in the next few candles would still count.`;
    case "breakout_up": case "breakdown": { const u = st.state === "breakout_up";
      if (st.target_kind === "atr" && st.target_zone) {
        const z = st.target_zone;
        return `${SYM} closed <b class="u-${u ? "up" : "down"}">${u ? "above" : "below"} its hub</b>. No historical shelf was found, so the suggested take-profit zone is <b class="u-${u ? "up" : "down"}">${money(z.low)}–${money(z.high)}</b> (${pctFrom(z.low, p)} to ${pctFrom(z.high, p)} from here). It fails on a 4H close back ${u ? "below" : "above"} ${money(u ? h.high : h.low)}.`;
      }
      return `${SYM} closed <b class="u-${u ? "up" : "down"}">${u ? "above" : "below"} its hub</b>. Next shelf target ${money(st.target)} (${pctFrom(st.target, p)}). It fails on a 4H close back ${u ? "below" : "above"} ${money(u ? h.high : h.low)}.`; }

    case "follow-through": return "The last breakout reached its shelf. Waiting for a new hub.";
    case "snap-back": return "The last breakout failed. Waiting for a new hub.";
    case "stalled": return "The last breakout ran out of time. Waiting for a new hub.";
    default: return "No tight range right now." + (up || dn ? " Nearest shelves: " + [up && `<b class="u-up">${money(up.level)}</b> above`, dn && `<b class="u-down">${money(dn.level)}</b> below`].filter(Boolean).join(", ") + "." : "");
  }
}

async function load(tf = TF) {
  let d;
  try {
    const r = await fetch(`/api/chart/${encodeURIComponent(SYM)}?tf=${encodeURIComponent(tf)}`);
    d = await r.json();
    if (!r.ok) throw new Error(d.detail || r.statusText);
  } catch (e) {
    const why = !navigator.onLine ? "You're offline. Check your internet connection."
      : /Failed to fetch|NetworkError|Load failed/i.test(e.message) ? "Can't reach NextShelf right now." : e.message;
    $("main").innerHTML = `<div class="errbox" role="alert"><div><b>Couldn't load ${esc(SYM)}</b><span>${esc(why)}</span></div>
      <button class="btnx" onclick="location.reload()">Try again</button></div>`;
    return;
  }
  TF = d.tf || tf;
  render(d);
}

function render(d) {
  if (d.guest) $("signin").innerHTML = ` &nbsp;·&nbsp; <a href="/login" style="color:var(--hub)">Sign in</a>`;
  const st = d.status, [label, color] = STATES[st.state] || ["", "--idle"], s = d.stats;
  const sign = (v) => v == null ? "–" : (v > 0 ? "+" : "") + v + "%";
  $("main").innerHTML = `
    <header>
      <h1>${esc(d.symbol)}<small>${money(st.last_close)}</small></h1>
      <span style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
        <span class="badge" style="--c:var(${color})">${label}</span>
        <span class="seg" role="tablist" aria-label="Chart timeframe">
          <button type="button" data-tf="4h" class="${TF === "4h" ? "on" : ""}" role="tab" aria-selected="${TF === "4h"}">4H</button>
          <button type="button" data-tf="1d" class="${TF === "1d" ? "on" : ""}" role="tab" aria-selected="${TF === "1d"}">Daily</button>
        </span></span>
    </header>
    <p class="sum">${summary(st)}</p>
    <div class="card"><div id="chart"></div>
      <div class="legend">
        <span style="--c:var(--hub)"><i></i>Hubs</span>
        <span style="--c:var(--up)"><i class="dash"></i>Shelf above</span>
        <span style="--c:var(--down)"><i class="dash"></i>Shelf below</span>
        <span>▲▼ breakouts, labelled hit / failed / timed out</span>
        <span>${d.tf === "1d" ? "Daily candles (hubs and breakouts still come from 4H closes)" : "4H candles"}, regular hours, New York time</span>
        ${d.tightening ? `<span style="--c:var(--snap)"><i></i>Tightening hubs (Lab, only you see this)</span>` : ""}
        ${d.setups && d.setups.lines.some(l => l.kind === "triangle") ? `<span style="--c:#F2C14E"><i></i>Triangles</span>` : ""}
        ${d.setups && d.setups.lines.some(l => l.kind.startsWith("channel")) ? `<span style="--c:#2FD4C0"><i></i>Channels</span>` : ""}
        ${d.setups && d.setups.lines.some(l => l.kind.startsWith("flag")) ? `<span style="--c:#B48CFF"><i></i>Flags</span>` : ""}
        ${d.setups && d.setups.lines.some(l => l.kind.startsWith("double")) ? `<span style="--c:#FF6FAE"><i></i>Double top / bottom (peak & neckline)</span>` : ""}
        ${d.setups && d.setups.levels.length ? `<span style="--c:#C3C7CF"><i class="dash"></i>Support / resistance (3+ touches)</span>` : ""}
      </div>
    </div>
    <div style="margin-top:14px">${d.watching ? `<button class="sec" disabled>✓ On your watchlist</button>` : `<button id="watch">+ Add to watchlist</button>`}</div>
    <div class="broker-row">${brokerLinks(SYM, d.exchange)}</div>
    <h2>Past <em>results</em></h2>
    <p class="scope">This ticker only · 4H breakouts</p>
    ${s.n ? `<div class="kv hero">
      <div><small>Breakouts</small><b>${s.n}</b></div>
      <div><small>Avg per trade</small><b style="color:var(${(s.expectancy_pct ?? 0) > 0 ? "--up" : "--down"})">${sign(s.expectancy_pct)}</b></div>
    </div>
    <div class="reach"><small>Reached shelf</small><b>${Math.round(s["follow-through"] * s.n / 100)} of ${s.n} · ${s["follow-through"]}%</b><div class="rbar"><i style="width:${s["follow-through"]}%"></i></div></div>
    <div class="winline"><small>Win rate (entered at close)</small><b>${s.win_rate ?? "–"}%${s.trades != null ? ` <span style="font-size:12px;font-weight:500;color:var(--muted)">of ${s.trades} trade${s.trades === 1 ? "" : "s"}</span>` : ""}</b><p class="why">Reached shelf counts every breakout that got to the shelf, including ones already there on the breakout candle, too late to enter. Win rate counts only the trades you could have entered at the close, and how many of them finished in profit.</p></div>
    <p class="note">Past results don't guarantee future ones.</p>`
    : `<p class="note">No completed breakouts in this period yet.</p>`}
    ${d.setups ? `<h2>Other <em>setups</em> <small style="font-size:12px;color:var(--snap)">beta</small></h2>
      ${(() => {
        const rows = [["double_top", "Double tops"], ["double_bottom", "Double bottoms"], ["gapfade", "Post-earnings gap fade & rip"]];
        const withN = [], zero = [];
        rows.forEach(([k, l]) => { const x = d.setups.stats[k] || {}; (x.n ? withN : zero).push([k, l, x]); });
        const rowHtml = withN.map(([k, l, x]) => x.n < 5
          ? `<div class="tiny"><small>${l}</small><b>${x.n} break${x.n === 1 ? "" : "s"} · <span>win ${x.win_rate ?? "–"}%</span> <span class="tiny-tag">tiny sample</span></b></div>`
          : `<div><small>${l}</small><b>${x.win_rate ?? "–"}% <span style="font-size:12px;color:var(--muted)">win · ${x.n} breaks</span></b></div>`).join("");
        const zeroLine = zero.length ? `<p class="note">No ${zero.map(([, l]) => l.toLowerCase()).join(", ")} in this period yet.</p>` : "";
        return (rowHtml ? `<div class="kv">${rowHtml}</div>` : "") + zeroLine;
      })()}
      <p class="note">Same rules as hubs: act on a 4-hour close outside the pattern, target the next shelf. Based on this chart only.</p>` : ""}
    ${d.tightening_stats ? `<h2>Lab · <em>tightening hubs</em></h2><div class="kv">
      <div><small>Breakouts</small><b>${d.tightening_stats.n}</b></div>
      <div><small>Reached shelf</small><b>${d.tightening_stats["follow-through"]}%</b></div>
      <div><small>Win rate</small><b>${d.tightening_stats.win_rate ?? "–"}%</b></div>
      <div><small>Avg per trade</small><b>${sign(d.tightening_stats.expectancy_pct)}</b></div></div>
      <p class="note">Test mode, visible only to admins. Members don't see tightening hubs or get alerts for them.</p>` : ""}`;

  document.querySelectorAll(".seg button").forEach(b => {
    b.onclick = () => { if (b.dataset.tf !== TF) { b.disabled = true; load(b.dataset.tf); } };
  });

  if ($("watch")) $("watch").onclick = async (e) => {
    if (d.guest) {
      try { localStorage.setItem("hs_pending_add", d.symbol); } catch (err) {}
      location.href = "/login#signup"; return;
    }
    e.target.disabled = true; e.target.textContent = "Adding…";
    const r = await fetch("/api/tickers", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({symbol: d.symbol})});
    const j = await r.json().catch(() => ({}));
    e.target.textContent = r.ok ? "✓ Added to your watchlist" : (r.status === 402 ? "Free plan limit reached. Upgrade in Account" : (j.detail || "Couldn't add"));
  };

  const el = $("chart");
  if (chart) { try { chart.remove(); } catch (e) {} }
  const daily = d.tf === "1d";
  chart = LightweightCharts.createChart(el, {
    autoSize: true,
    layout: { background: { color: "transparent" }, textColor: css("--muted"), fontFamily: "Geist Mono, ui-monospace, monospace", fontSize: 11 },
    grid: { vertLines: { color: css("--line") }, horzLines: { color: css("--line") } },
    rightPriceScale: { borderColor: css("--line") },
    timeScale: { borderColor: css("--line"), timeVisible: !daily, secondsVisible: false },
    crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
  });
  const candles = chart.addCandlestickSeries({
    upColor: css("--up"), downColor: css("--down"), borderVisible: false,
    wickUpColor: css("--up"), wickDownColor: css("--down"), priceLineVisible: false,
  });
  candles.setData(d.candles);

  // volume: own scale in the bottom pane, coloured by candle direction.
  // Skipped entirely when the payload carries no volume (fail-open).
  const hexA = (hex, a) => {
    const m = /^#?([0-9a-f]{6})$/i.exec((hex || "").trim());
    if (!m) return undefined;
    const n = parseInt(m[1], 16);
    return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${a})`;
  };
  if (d.candles.length && typeof d.candles[0].volume === "number") {
    const upV = hexA(css("--up"), .45), dnV = hexA(css("--down"), .45);
    const vol = chart.addHistogramSeries({ priceFormat: { type: "volume" }, priceScaleId: "vol",
                                           lastValueVisible: false, priceLineVisible: false });
    vol.setData(d.candles.filter(c => typeof c.volume === "number").map(c => ({ time: c.time, value: c.volume,
      color: c.close >= c.open ? upV : dnV })));
    chart.priceScale("vol").applyOptions({ scaleMargins: { top: 0.8, bottom: 0 } });
    chart.priceScale("right").applyOptions({ scaleMargins: { top: 0.05, bottom: 0.25 } });
  }

  // on the daily view, overlay times (4H candle times) are floored to the day so they land on a daily bar
  const dayStart = (ts) => { const dt = new Date(ts * 1000); return Date.UTC(dt.getUTCFullYear(), dt.getUTCMonth(), dt.getUTCDate()) / 1000; };
  const ot = (ts) => (daily ? dayStart(ts) : ts);

  // hubs: a top and bottom line for each hub (separate series so neighbouring hubs never join)
  const times = d.candles.map(c => c.time);
  d.hubs.forEach(h => {
    const span = times.filter(t => t >= ot(h.start) && t <= ot(h.end));
    if (span.length < 2) return;
    ["high", "low"].forEach(k => {
      const ser = chart.addLineSeries({ color: css("--hub"), lineWidth: h.active ? 3 : 2, priceLineVisible: false,
                                        lastValueVisible: false, crosshairMarkerVisible: false });
      ser.setData(span.map(t => ({ time: t, value: h[k] })));
    });
  });

  // admin test mode: tightening hubs (triangles) in orange
  if (d.tightening) {
    d.tightening.forEach(tp => {
      [["ua", "ub"], ["la", "lb"]].forEach(([a, b]) => {
        const ser = chart.addLineSeries({ color: css("--snap"), lineWidth: 2, lineStyle: LightweightCharts.LineStyle.Solid,
                                          priceLineVisible: false, lastValueVisible: false, crosshairMarkerVisible: false });
        if (ot(tp.end) > ot(tp.start)) ser.setData([{ time: ot(tp.start), value: tp[a] }, { time: ot(tp.end), value: tp[b] }]);
      });
    });
  }

  // other setups: triangles (yellow), channels (teal), support/resistance levels (dotted)
  if (d.setups) {
    d.setups.lines.forEach(l => {
      const col = l.kind === "triangle" ? "#F2C14E" : l.kind.startsWith("flag") ? "#B48CFF" : l.kind.startsWith("double") ? "#FF6FAE" : l.kind === "gapfade" ? "#FF9F43" : l.kind.startsWith("fail") ? "#5AC8FA" : l.kind === "flush" ? "#7EE081" : "#2FD4C0";
      [["ua", "ub"], ["la", "lb"]].forEach(([a, b]) => {
        const ser = chart.addLineSeries({ color: col, lineWidth: l.live ? 2 : 1, lineStyle: l.live ? LightweightCharts.LineStyle.Solid : LightweightCharts.LineStyle.Dotted,
                                          priceLineVisible: false, lastValueVisible: false, crosshairMarkerVisible: false });
        if (ot(l.end) > ot(l.start)) ser.setData([{ time: ot(l.start), value: l[a] }, { time: ot(l.end), value: l[b] }]);
      });
    });
    const p = st.last_close;
    d.setups.levels.filter(L => Math.abs(L.price / p - 1) < 0.12).sort((a, b) => Math.abs(a.price - p) - Math.abs(b.price - p)).slice(0, 4)
      .forEach(L => candles.createPriceLine({ price: L.price, color: "rgba(201,211,223,.55)", lineWidth: 1, lineStyle: LightweightCharts.LineStyle.Dotted,
        axisLabelVisible: true, title: `${L.price > p ? "R" : "S"} ×${L.touches}` }));
  }

  // shelves from here
  if (st.shelf_up) candles.createPriceLine({ price: st.shelf_up.level, color: css("--up"), lineWidth: 1,
    lineStyle: LightweightCharts.LineStyle.Dashed, axisLabelVisible: true, title: "Shelf ▲" });
  if (st.shelf_down) candles.createPriceLine({ price: st.shelf_down.level, color: css("--down"), lineWidth: 1,
    lineStyle: LightweightCharts.LineStyle.Dashed, axisLabelVisible: true, title: "Shelf ▼" });
  if (st.old_high) candles.createPriceLine({ price: st.old_high.level, color: "#9AA0AC", lineWidth: 1,
    lineStyle: LightweightCharts.LineStyle.Dotted, axisLabelVisible: true, title: "Old high (wick)" });
  if (st.old_low) candles.createPriceLine({ price: st.old_low.level, color: "#9AA0AC", lineWidth: 1,
    lineStyle: LightweightCharts.LineStyle.Dotted, axisLabelVisible: true, title: "Old low (wick)" });

  // breakout markers
  const word = { "follow-through": "hit", "snap-back": "failed", stalled: "timed out", pending: "live" };
  candles.setMarkers(d.trades.map(t => ({
    time: ot(t.time), position: t.direction === 1 ? "belowBar" : "aboveBar",
    shape: t.direction === 1 ? "arrowUp" : "arrowDown",
    color: t.direction === 1 ? css("--up") : css("--down"),
    text: t.chase ? "chase" : word[t.outcome] || "",
  })).sort((a, b) => a.time - b.time));

  // start zoomed to the last ~120 candles
  const n = d.candles.length;
  chart.timeScale().setVisibleLogicalRange({ from: Math.max(0, n - (el.clientWidth < 600 ? 60 : 120)), to: n + 3 });
}
load();
</script>
<script>
// leave the chart: go back to wherever you came from in NextShelf, otherwise to Browse setups
function goBack(e) {
  if (e) e.preventDefault();
  let ref = "";
  try { ref = document.referrer ? new URL(document.referrer).origin : ""; } catch (_) {}
  if (ref === location.origin && history.length > 1) history.back();
  else location.href = "/app#discover";
  return false;
}
document.addEventListener("keydown", (e) => { if (e.key === "Escape") goBack(e); });
</script>

<script>
/* the chart reads its colours when it draws: redraw after switching themes */
(function () { var set = window.nsSetTheme; window.nsSetTheme = function (p) { set(p); location.reload(); }; })();
</script>
<script>
// ---- early access: while sign-ups are closed, every "Sign up" link becomes "Join the waitlist"
(function () {
  const LAND = false;
  const swap = (t) => {
    const s = t.trim(), arrow = /→\s*$/.test(s) ? " →" : "";
    if (/^(sign up|create)/i.test(s) || /free account|get started|free beta/i.test(s)) return (/^sign up$/i.test(s) ? "Join the waitlist" : "Join the waitlist") + arrow;
    if (/^sign up free to/i.test(s)) return "Join the waitlist" + arrow;
    return null;
  };
  function fix(root) {
    (root.querySelectorAll ? root : document).querySelectorAll('a[href="/login#signup"]').forEach(a => {
      if (a.dataset.wl) return; a.dataset.wl = 1;
      if (LAND) a.href = "#join";
      const n = [...a.childNodes].find(x => x.nodeType === 3 && x.textContent.trim());
      const t = n ? swap(n.textContent) : null; if (t) n.textContent = t + (n.textContent.endsWith(" ") ? " " : "");
    });
  }
  Promise.all([fetch("/auth/config").then(r => r.json()), fetch("/api/me").then(r => r.json()).catch(() => null)]).then(([c, me]) => {
    if (c.signups_open !== false || (me && !me.guest)) return;
    window.NS_WAITLIST = true; document.documentElement.classList.add("waitlist");
    fix(document);
    new MutationObserver(ms => ms.forEach(m => m.addedNodes.forEach(x => x.nodeType === 1 && fix(x.parentNode || x)))).observe(document.body, {childList: true, subtree: true});
  }).catch(() => {});
})();
</script>
