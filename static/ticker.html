<script>
/* light/dark: "system" (default) follows the device; choice saved per browser */
(function () {
  var pick = "system"; try { pick = localStorage.getItem("ns_theme") || "system"; } catch (e) {}
  var mq = window.matchMedia ? matchMedia("(prefers-color-scheme: light)") : null;
  function apply(p) {
    var t = p === "system" ? (mq && mq.matches ? "light" : "dark") : p;
    document.documentElement.dataset.theme = t; document.documentElement.dataset.themePick = p;
    var m = document.querySelector('meta[name="theme-color"]'); if (m) m.content = t === "light" ? "#F6F6F3" : "#0E0F12";
    document.querySelectorAll("[data-theme-btn]").forEach(function (b) { b.setAttribute("aria-label", "Theme: " + p + " (switch)"); b.title = t === "light" ? "Switch to dark" : "Switch to light"; b.dataset.mode = t; });
    document.querySelectorAll("[data-theme-opt]").forEach(function (b) { b.classList.toggle("on", b.dataset.themeOpt === p); });
  }
  window.nsSetTheme = function (p) { try { localStorage.setItem("ns_theme", p); } catch (e) {} pick = p; apply(p); };
  window.nsToggleTheme = function () { nsSetTheme(document.documentElement.dataset.theme === "light" ? "dark" : "light"); };
  if (mq && mq.addEventListener) mq.addEventListener("change", function () { if (pick === "system") apply("system"); });
  apply(pick);
  document.addEventListener("DOMContentLoaded", function () { apply(pick); });
})();
</script>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const IS_ANDROID = /Android/i.test(navigator.userAgent || "");
// On Android, open the broker's app when it's installed and fall back to the website when it isn't
// (an intent link with the app's package and a browser fallback). iPhones use the plain link, which
// opens the app through the broker's universal links when the broker supports them.
const appHref = (url, pkg) => {
  if (!url || !IS_ANDROID) return url;
  const u = new URL(url);
  return `intent://${u.host}${u.pathname}${u.search}#Intent;scheme=https;package=${pkg};S.browser_fallback_url=${encodeURIComponent(url)};end`;
};
if (IS_ANDROID) document.addEventListener("click", (e) => {   // open intent links in place, not a blank new tab
  const a = e.target.closest && e.target.closest('a[href^="intent:"]');
  if (a) { e.preventDefault(); location.href = a.href; }
});
const rhUrl = (s) => appHref(`https://robinhood.com/stocks/${encodeURIComponent(s.toUpperCase())}`, "com.robinhood.android");
const wbUrl = (s, ex) => ex ? appHref(`https://www.webull.com/quote/${ex}-${encodeURIComponent(s.toLowerCase())}`, "org.dayup.stocks") : null;
const brokerLinks = (s, ex) => {
  const wb = wbUrl(s, ex);
  return `${wb ? `<a class="broker" href="${wb}" target="_blank" rel="noopener" title="Open ${esc(s)} in Webull" aria-label="Open ${esc(s)} in Webull"><img class="broker-logo" src="/vendor/webull-mark.png" alt="Webull" width="18" height="18"></a>` : ""}<a class="broker" href="${rhUrl(s)}" target="_blank" rel="noopener" title="Open ${esc(s)} in Robinhood" aria-label="Open ${esc(s)} in Robinhood"><img class="broker-logo" src="/vendor/robinhood.svg" alt="Robinhood" width="18" height="18"></a>`;
};
const money = (x) => x == null ? "–" : "$" + Number(x).toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2});
const pctFrom = (lvl, p) => { const v = (lvl / p - 1) * 100; return (v > 0 ? "+" : "") + v.toFixed(1) + "%"; };
const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const STATES = { forming: ["Inside hub", "--hub"], watching: ["Hub just ended", "--idle"], breakout_up: ["Breakout ↑", "--up"],
  breakdown: ["Breakdown ↓", "--down"], "follow-through": ["Hit shelf", "--ft"], "snap-back": ["Failed breakout", "--snap"],
  stalled: ["Timed out", "--stall"], none: ["Waiting for a hub", "--idle"] };
const SYM = decodeURIComponent(location.pathname.split("/").pop()).toUpperCase();
let TF = "4h", chart = null;
window.__nsLiveT = null;
document.title = `${SYM} · NextShelf`;

function summary(st) {
  const p = st.last_close, h = st.hub, up = st.shelf_up, dn = st.shelf_down;
  const lvl = (sh, w) => sh ? `the next shelf is <b class="u-${w}">${money(sh.level)}</b> (${pctFrom(sh.level, p)})` : `there's no shelf ${w === "up" ? "above" : "below"} yet`;
  switch (st.state) {
    case "forming": return `${SYM} has held a tight range for <b>${h.sessions} sessions</b>. A 4H close <b class="u-up">above ${money(st.trigger_up || h.high)}</b>: ${lvl(up, "up")}. A 4H close <b class="u-down">below ${money(st.trigger_down || h.low)}</b>: ${lvl(dn, "down")}.`;
    case "watching": return `The range just ended without a breakout. A 4H close above ${money(h.high)} or below ${money(h.low)} in the next few candles would still count.`;
    case "breakout_up": case "breakdown": { const u = st.state === "breakout_up";
      const br = (st.setups || []).find(x => x.state === "breakout_up" || x.state === "breakdown");
      const fl = br && br.flow ? (br.flow.side === "call"
        ? ` At the breakout, call volume ran ${br.flow.call_voi.toFixed(1)}× open interest — the options crowd was buying the same direction.`
        : br.flow.side === "put"
        ? ` At the breakout, put volume ran ${br.flow.put_voi.toFixed(1)}× open interest — the options crowd was buying the other way.`
        : "") : "";
      if (st.target_kind === "atr" && st.target_zone) {
        const z = st.target_zone;
        return `${SYM} closed <b class="u-${u ? "up" : "down"}">${u ? "above" : "below"} its hub</b>. No historical shelf was found, so the suggested take-profit zone is <b class="u-${u ? "up" : "down"}">${money(z.low)}–${money(z.high)}</b> (${pctFrom(z.low, p)} to ${pctFrom(z.high, p)} from here). It fails on a 4H close back ${u ? "below" : "above"} ${money(u ? h.high : h.low)}.${fl}`;
      }
      return `${SYM} closed <b class="u-${u ? "up" : "down"}">${u ? "above" : "below"} its hub</b>. Next shelf target ${money(st.target)} (${pctFrom(st.target, p)}). It fails on a 4H close back ${u ? "below" : "above"} ${money(u ? h.high : h.low)}.${fl}`; }

    case "follow-through": return "The last breakout reached its shelf. Waiting for a new hub.";
    case "snap-back": return "The last breakout failed. Waiting for a new hub.";
    case "stalled": return "The last breakout ran out of time. Waiting for a new hub.";
    default: return "No tight range right now." + (up || dn ? " Nearest shelves: " + [up && `<b class="u-up">${money(up.level)}</b> above`, dn && `<b class="u-down">${money(dn.level)}</b> below`].filter(Boolean).join(", ") + "." : "");
  }
}

async function load(tf = TF) {
  let d;
  try {
    const r = await fetch(`/api/chart/${encodeURIComponent(SYM)}?tf=${encodeURIComponent(tf)}`);
    d = await r.json();
    if (!r.ok) throw new Error(d.detail || r.statusText);
  } catch (e) {
    const why = !navigator.onLine ? "You're offline. Check your internet connection."
      : /Failed to fetch|NetworkError|Load failed/i.test(e.message) ? "Can't reach NextShelf right now." : e.message;
    $("main").innerHTML = `<div class="errbox" role="alert"><div><b>Couldn't load ${esc(SYM)}</b><span>${esc(why)}</span></div>
      <button class="btnx" onclick="location.reload()">Try again</button></div>`;
    return;
  }
  TF = d.tf || tf;
  render(d);
}

function render(d) {
  if (window.__nsLiveT) clearTimeout(window.__nsLiveT);
  window.__nsLiveT = null;
  if (d.guest) $("signin").innerHTML = ` &nbsp;·&nbsp; <a href="/login" style="color:var(--hub)">Sign in</a>`;

        ${d.setups && d.setups.lines.some(l => l.kind === "triangle") ? `<span style="--c:#F2C14E"><i></i>Triangles</span>` : ""}
        ${d.setups && d.setups.lines.some(l => l.kind.startsWith("channel")) ? `<span style="--c:#2FD4C0"><i></i>Channels</span>` : ""}
        ${d.setups && d.setups.lines.some(l => l.kind.startsWith("flag")) ? `<span style="--c:#B48CFF"><i></i>Flags</span>` : ""}
        ${d.setups && d.setups.lines.some(l => l.kind.startsWith("double")) ? `<span style="--c:#FF6FAE"><i></i>Double top / bottom (peak & neckline)</span>` : ""}
        ${d.setups && d.setups.levels.length ? `<span style="--c:#C3C7CF"><i class="dash"></i>Support / resistance (3+ touches)</span>` : ""}

    <!-- Patch 191: the plan and the chart open; the rest one tap down, in a fixed order -->
    <details class="tk-sec" id="secOptions"><summary>Options</summary><div id="optionsSwing" class="card"></div></details>

    <details class="tk-sec" id="secResults"><summary>Past results</summary>
    <h2>Past <em>results</em></h2>
    <p class="scope">This ticker only · 4H breakouts</p>
    ${s.n ? `<div class="kv hero">
      <div><small>Breakouts</small><b>${s.n}</b></div>
      <div><small>Avg per trade</small><b style="color:var(${(s.expectancy_pct ?? 0) > 0 ? "--up" : "--down"})">${sign(s.expectancy_pct)}</b></div>
    </div>
    <div class="reach"><small>Reached shelf</small><b>${Math.round(s["follow-through"] * s.n / 100)} of ${s.n} · ${s["follow-through"]}%</b><div class="rbar"><i style="width:${s["follow-through"]}%"></i></div></div>
    <div class="winline"><small>Win rate (entered at close)</small><b>${s.win_rate ?? "–"}%${s.trades != null ? `&nbsp;<span style="font-size:12px;font-weight:500;color:var(--muted)">of ${s.trades} trade${s.trades === 1 ? "" : "s"}</span>` : ""}</b><p class="why">Reached shelf counts every breakout that got to the shelf, including ones already there on the breakout candle, too late to enter. Win rate counts only the trades you could have entered at the close, and how many of them finished in profit.</p></div>
    <p class="note">Past results don't guarantee future ones.</p>`
    : `<p class="note">No completed breakouts in this period yet.</p>`}
    ${d.setups ? `<h2>Other <em>setups</em> <small style="font-size:12px;color:var(--snap)">beta</small></h2>
      ${(() => {
        const rows = [["double_top", "Double tops"], ["double_bottom", "Double bottoms"], ["gapfade", "Post-earnings gap fade & rip"]];
        const withN = [], zero = [];
        rows.forEach(([k, l]) => { const x = d.setups.stats[k] || {}; (x.n ? withN : zero).push([k, l, x]); });
        const rowHtml = withN.map(([k, l, x]) => x.n < 5
          ? `<div class="tiny"><small>${l}</small><b>${x.n} break${x.n === 1 ? "" : "s"} · <span>win ${x.win_rate ?? "–"}%</span>&nbsp;<span class="tiny-tag">tiny sample</span></b></div>`
          : `<div><small>${l}</small><b>${x.win_rate ?? "–"}%&nbsp;<span style="font-size:12px;color:var(--muted)">win · ${x.n} breaks</span></b></div>`).join("");
        const zeroLine = zero.length ? `<p class="note">No ${zero.map(([, l]) => l.toLowerCase()).join(", ")} in this period yet.</p>` : "";
        return (rowHtml ? `<div class="kv">${rowHtml}</div>` : "") + zeroLine;
      })()}
      <p class="note">Same rules as hubs: act on a 4-hour close outside the pattern, target the next shelf. Based on this chart only.</p>` : ""}
    ${d.tightening_stats ? `<h2>Lab · <em>tightening hubs</em></h2><div class="kv">
      <div><small>Breakouts</small><b>${d.tightening_stats.n}</b></div>
      <div><small>Reached shelf</small><b>${d.tightening_stats["follow-through"]}%</b></div>
      <div><small>Win rate</small><b>${d.tightening_stats.win_rate ?? "–"}%</b></div>
      <div><small>Avg per trade</small><b>${sign(d.tightening_stats.expectancy_pct)}</b></div></div>
      <p class="note">Test mode, visible only to admins. Members don't see tightening hubs or get alerts for them.</p>` : ""}
    </details>`;
  // a section drawn while collapsed redraws at its real width when opened
  document.querySelectorAll("details.tk-sec").forEach(dt => dt.addEventListener("toggle", () => { if (dt.open) window.dispatchEvent(new Event("resize")); }));

  document.querySelectorAll(".seg button").forEach(b => {

  if ($("watch")) $("watch").onclick = async (e) => {
    if (d.guest) {
      try { localStorage.setItem("hs_pending_add", d.symbol); } catch (err) {}
      location.href = "/login#signup"; return;
    }
    e.target.disabled = true; e.target.textContent = "Adding…";
    const r = await fetch("/api/tickers", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({symbol: d.symbol})});
    const j = await r.json().catch(() => ({}));
    e.target.textContent = r.ok ? "✓ Added to your watchlist" : (r.status === 402 ? "Free plan limit reached. Upgrade in Account" : (j.detail || "Couldn't add"));
  };

  const el = $("chart");
  if (chart) { try { chart.remove(); } catch (e) {} }
  const daily = d.tf === "1d";
  chart = LightweightCharts.createChart(el, {
    autoSize: true,
    layout: { background: { color: "transparent" }, textColor: css("--muted"), fontFamily: "Geist Mono, ui-monospace, monospace", fontSize: 11 },
    // hairline grid: faint enough that the candles carry the picture
    grid: { vertLines: { color: document.documentElement.dataset.theme === "light" ? "rgba(13,17,23,.05)" : "rgba(255,255,255,.045)" },
            horzLines: { color: document.documentElement.dataset.theme === "light" ? "rgba(13,17,23,.05)" : "rgba(255,255,255,.045)" } },
    rightPriceScale: { borderColor: css("--line") },
    timeScale: { borderColor: css("--line"), timeVisible: !daily, secondsVisible: false },
    crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
  });
  // the member's candle style (Account > Chart style): candles, hollow, bars or line, and their own colours
  const CP = (() => { try { return JSON.parse(localStorage.getItem("ns-candles") || "{}"); } catch (e) { return {}; } })();
  const upC = CP.up || css("--up"), dnC = CP.down || css("--down"), ctype = CP.type || "candles";
  let candles;
  if (ctype === "bars") {
    candles = chart.addBarSeries({ upColor: upC, downColor: dnC, thinBars: false, priceLineVisible: false });
    candles.setData(d.candles);
  } else if (ctype === "line") {
    candles = chart.addLineSeries({ color: upC, lineWidth: 2, priceLineVisible: false });
    candles.setData(d.candles.map(c => ({ time: c.time, value: c.close })));
  } else {
    candles = chart.addCandlestickSeries({
      upColor: ctype === "hollow" ? "rgba(0,0,0,0)" : upC, downColor: dnC, borderVisible: ctype === "hollow",
      borderUpColor: upC, borderDownColor: dnC, wickUpColor: upC, wickDownColor: dnC, priceLineVisible: false,
    });
    candles.setData(d.candles);
  }

  // volume: own scale in the bottom pane, coloured by candle direction.
  // Skipped entirely when the payload carries no volume (fail-open).
  const hexA = (hex, a) => {
    const m = /^#?([0-9a-f]{6})$/i.exec((hex || "").trim());
    if (!m) return undefined;
    const n = parseInt(m[1], 16);
    return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${a})`;
  };
  if (d.candles.length && typeof d.candles[0].volume === "number") {
    const upV = hexA(upC, .45) || hexA(css("--up"), .45), dnV = hexA(dnC, .45) || hexA(css("--down"), .45);
    const vol = chart.addHistogramSeries({ priceFormat: { type: "volume" }, priceScaleId: "vol",
                                           lastValueVisible: false, priceLineVisible: false });
    vol.setData(d.candles.filter(c => typeof c.volume === "number").map(c => ({ time: c.time, value: c.volume,
      color: c.close >= c.open ? upV : dnV })));
    chart.priceScale("vol").applyOptions({ scaleMargins: { top: 0.8, bottom: 0 } });
    chart.priceScale("right").applyOptions({ scaleMargins: { top: 0.05, bottom: 0.25 } });
  }

  // on the daily view, overlay times (4H candle times) are floored to the day so they land on a daily bar
  const dayStart = (ts) => { const dt = new Date(ts * 1000); return Date.UTC(dt.getUTCFullYear(), dt.getUTCMonth(), dt.getUTCDate()) / 1000; };
  const ot = (ts) => (daily ? dayStart(ts) : ts);

  // hubs: a top and bottom line for each hub (separate series so neighbouring hubs never join)
  const times = d.candles.map(c => c.time);
  d.hubs.forEach(h => {
    const span = times.filter(t => t >= ot(h.start) && t <= ot(h.end));
    if (span.length < 2) return;
    ["high", "low"].forEach(k => {
      const ser = chart.addLineSeries({ color: css("--hub"), lineWidth: h.active ? 3 : 2, priceLineVisible: false,
                                        lastValueVisible: false, crosshairMarkerVisible: false });
      ser.setData(span.map(t => ({ time: t, value: h[k] })));
    });
  });

  // admin test mode: tightening hubs (triangles) in orange
  if (d.tightening) {
    d.tightening.forEach(tp => {
      [["ua", "ub"], ["la", "lb"]].forEach(([a, b]) => {
        const ser = chart.addLineSeries({ color: css("--snap"), lineWidth: 2, lineStyle: LightweightCharts.LineStyle.Solid,
                                          priceLineVisible: false, lastValueVisible: false, crosshairMarkerVisible: false });
        if (ot(tp.end) > ot(tp.start)) ser.setData([{ time: ot(tp.start), value: tp[a] }, { time: ot(tp.end), value: tp[b] }]);
      });
    });
  }

  // other setups: triangles (yellow), channels (teal), support/resistance levels (dotted)
  if (d.setups) {
    d.setups.lines.forEach(l => {
      const col = l.kind === "triangle" ? "#F2C14E" : l.kind.startsWith("flag") ? "#B48CFF" : l.kind.startsWith("double") ? "#FF6FAE" : l.kind === "gapfade" ? "#FF9F43" : l.kind.startsWith("fail") ? "#5AC8FA" : l.kind === "flush" ? "#7EE081" : "#2FD4C0";
      [["ua", "ub"], ["la", "lb"]].forEach(([a, b]) => {
        const ser = chart.addLineSeries({ color: col, lineWidth: l.live ? 2 : 1, lineStyle: l.live ? LightweightCharts.LineStyle.Solid : LightweightCharts.LineStyle.Dotted,
                                          priceLineVisible: false, lastValueVisible: false, crosshairMarkerVisible: false });
        if (ot(l.end) > ot(l.start)) ser.setData([{ time: ot(l.start), value: l[a] }, { time: ot(l.end), value: l[b] }]);
      });
    });
    const p = st.last_close;
    d.setups.levels.filter(L => Math.abs(L.price / p - 1) < 0.12).sort((a, b) => Math.abs(a.price - p) - Math.abs(b.price - p)).slice(0, 4)
      .forEach(L => candles.createPriceLine({ price: L.price, color: "rgba(201,211,223,.55)", lineWidth: 1, lineStyle: LightweightCharts.LineStyle.Dotted,
        axisLabelVisible: true, title: `${L.price > p ? "R" : "S"} ×${L.touches}` }));
  }

  // shelves from here
  if (st.shelf_up) candles.createPriceLine({ price: st.shelf_up.level, color: css("--up"), lineWidth: 1,
    lineStyle: LightweightCharts.LineStyle.Dashed, axisLabelVisible: true, title: "Shelf ▲" });
  if (st.shelf_down) candles.createPriceLine({ price: st.shelf_down.level, color: css("--down"), lineWidth: 1,
    lineStyle: LightweightCharts.LineStyle.Dashed, axisLabelVisible: true, title: "Shelf ▼" });
  if (st.old_high) candles.createPriceLine({ price: st.old_high.level, color: "#9AA0AC", lineWidth: 1,
    lineStyle: LightweightCharts.LineStyle.Dotted, axisLabelVisible: true, title: "Old high (wick)" });
  if (st.old_low) candles.createPriceLine({ price: st.old_low.level, color: "#9AA0AC", lineWidth: 1,
    lineStyle: LightweightCharts.LineStyle.Dotted, axisLabelVisible: true, title: "Old low (wick)" });

  // breakout markers
  const word = { "follow-through": "hit", "snap-back": "failed", stalled: "timed out", pending: "live" };
  candles.setMarkers(d.trades.map(t => ({
    time: ot(t.time), position: t.direction === 1 ? "belowBar" : "aboveBar",
    shape: t.direction === 1 ? "arrowUp" : "arrowDown",
    color: t.direction === 1 ? css("--up") : css("--down"),
    text: t.chase ? "chase" : word[t.outcome] || "",
  })).sort((a, b) => a.time - b.time));

  // start zoomed to the last ~120 candles
  const n = d.candles.length;
  chart.timeScale().setVisibleLogicalRange({ from: Math.max(0, n - (el.clientWidth < 600 ? 60 : 120)), to: n + 3 });
  // loadGexShelves();   // GEX shelves + heat map hidden (Nov 17); un-comment and drop `hidden` on #gexShelves to show it again
  loadOptionsPanel();
  loadSwingCard();


  // Live candle: poll the live price and move the forming candle in place.
  // The forming candle's time/open come from GET /api/forming (the server owns the 4H block),
  // the fresh price comes from GET /api/live (15 s cache). No chart rebuild.
  if (window.__nsLiveT) clearTimeout(window.__nsLiveT);
  const liveChart = chart;
  const pollLiveCandle = async () => {
    let delay = 300000;                           // check every 5 minutes while the market is closed
    if (document.visibilityState !== "hidden") {
      let px = null, fc = null, marketOpen = false;
      try {
        const r = await fetch(`/api/live?symbols=${encodeURIComponent(SYM)}`);
        const j = await r.json();
        marketOpen = !!j.market_open;
        if (marketOpen) px = j.prices && j.prices[SYM] ? +j.prices[SYM].price : null;
      } catch (e) {}
      if (marketOpen) {
        delay = 30000;                             // same 30-second cadence as the app while market is open
        if (px != null && Number.isFinite(px)) {
          try {
            const r2 = await fetch(`/api/forming/${encodeURIComponent(SYM)}`);
            fc = (await r2.json()).candle;
          } catch (e) {}
          if (fc && fc.time != null && chart === liveChart) {
            const t = daily ? dayStart(fc.time) : fc.time;
            if (ctype === "line") {
              candles.update({time: t, value: px});
            } else {
              // candles / hollow / bars all take OHLC; open comes from the forming candle, close/high/low from the live price
              candles.update({time: t, open: fc.open, high: Math.max(fc.high, px), low: Math.min(fc.low, px), close: px});
            }
          }
        }
      }
    }
    if (chart === liveChart) window.__nsLiveT = setTimeout(pollLiveCandle, delay);
  };
  window.__nsLiveT = setTimeout(pollLiveCandle, 30000);
}

// Patch 152 — Swing Play Card (Sika's read) on the dedicated ticker page. Display only.
async function loadSwingCard() {
  const host = document.getElementById("swingPlay");
  if (!host) return;
  const heading = '<h2>Swing <em>play</em> <span class="ox-edu">Educational</span></h2><p class="scope">Sika\'s read: the favored side, and the other side only on a break</p>';
  host.innerHTML = heading + '<p class="ox-note">Sika is reading the play…</p>';
  let me = null;
  try { me = await (await fetch("/api/me")).json(); } catch (e) {}
  if (!me || me.guest || !me.options) {
    host.innerHTML = heading + `<div class="ox-lock"><b>See how this breakout could be swung with options.</b><p>Calls or puts, the expiry that gives the move room, what the contract might be worth at the shelf, and what you'd lose if it fails.</p>
      <a class="btnx sm" href="${!me || me.guest ? "/login#signup" : "#account"}">${!me || me.guest ? "Sign up free" : "Pro feature · see plans"}</a></div>`;
    return;
  }
  let c = null;
  try {
    const r = await fetch("/api/swing-card/" + encodeURIComponent(SYM), {signal: AbortSignal.timeout(45000)});
    if (!r.ok) throw new Error("swing-card request failed");
    c = await r.json();
  } catch (e) {
    host.innerHTML = heading + '<p class="ox-note">Sika couldn\'t read the swing play right now.</p>';
    return;
  }
  host.innerHTML = heading + renderSwingCard(c);
}

// Patch 208: the second door — "I'm in — watch this" for a trade placed in the member's own broker app
// Patch 210: the Lookout mark, two round eyes (also binoculars). Ratios from R = 36; the pupils take the ground's colour
// via --lk-bg (set by the container), so the mark sits right on the sheet, a panel or the pill's tint.
const lkEyes = (w = 24, on = true) => `<svg class="lk-eyes" width="${w}" height="${Math.round(w * 72 / 134)}" viewBox="0 0 134 72" fill="none" role="img" aria-label="Lookout${on ? "" : " (watch ended)"}"><circle cx="36" cy="36" r="32" stroke="var(--lk-ring, #EEF1F5)" stroke-width="4"/><circle cx="98" cy="36" r="32" stroke="var(--lk-ring, #EEF1F5)" stroke-width="4"/><circle cx="36" cy="36" r="16.5" fill="${on ? "#3DD68C" : "#6C7686"}"/><circle cx="98" cy="36" r="16.5" fill="${on ? "#3DD68C" : "#6C7686"}"/><circle cx="36" cy="36" r="7.5" fill="var(--lk-bg, #07090D)"/><circle cx="98" cy="36" r="7.5" fill="var(--lk-bg, #07090D)"/></svg>`.replace(/^/, on ? '<span class="lk-pulse">' : "") + (on ? "</span>" : "");   // owner (Nov 23): option B, a ring ripples out while watching
function tkLookout(x) {
  const pl = x.plan, up = pl.direction !== -1, k = x.contract, el = document.createElement("div"); el.className = "lkt-back";
  const contract = k ? `${x.sym} ${k.expiry} $${k.strike} ${x.side === "puts" ? "Put" : "Call"}` : null;
  el.innerHTML = `<div class="lkt" role="dialog" aria-modal="true"><span class="lkt-badge">Watch a trade · ${esc(x.sym)}</span><h3 class="lkt-hd">${lkEyes(30)}<span>Hi, I'm Lookout 👋</span></h3>
    <p>I'll keep an eye on the trade you placed, if you let me. The trade stays yours: I never buy, sell or touch an order. I just tap you on the shoulder when something changes.</p>
    <div class="lkt-rows"><div><span>${contract ? "Position" : "Stock"}</span><b>${esc(contract || x.sym)}</b></div>
      <div><span>Your fill (optional)</span><input type="number" step="0.01" min="0" id="lktFill"></div><div><span>Size (optional)</span><input type="number" step="1" min="0" id="lktQty"></div>
      <div><span>Plan ends on a close ${up ? "below" : "above"}</span><b class="d">${money(pl.kill)}</b></div><div><span>Target</span><b>${money(pl.target)}</b></div></div>
    <div class="lkt-acts"><button type="button" class="lkt-x">Not now</button><button type="button" class="lkt-go">Yes, watch it</button></div>
    <small>Alerts go to your phone. "Not now" keeps the trade, I just won't watch it.</small></div>`;
  const done = () => el.remove();
  el.addEventListener("click", e => { if (e.target === el) done(); });
  el.querySelector(".lkt-x").onclick = done;
  el.querySelector(".lkt-go").onclick = async () => {
    const r = await fetch("/api/lookout/start", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({ticker: x.sym, kind: "hub", direction: pl.direction,
      contract, qty: +document.getElementById("lktQty").value || null, entry_price: +document.getElementById("lktFill").value || null, edge: pl.edge, target: pl.target, kill: pl.kill})});
    const j = await r.json().catch(() => ({}));
    el.querySelector(".lkt").innerHTML = r.ok ? `<h3>👀 Watching ${esc(x.sym)}</h3><p>Done. I'll tap you when the plan dies, the target is touched, time runs out, or earnings are next.</p><div class="lkt-acts"><button type="button" class="lkt-go" style="grid-column:1/-1">Done</button></div>`
      : `<h3>Couldn't start the watch</h3><p>${esc(j.detail || "Sign in and try again.")}</p><div class="lkt-acts"><button type="button" class="lkt-go" style="grid-column:1/-1">OK</button></div>`;
    el.querySelector(".lkt-go").onclick = done;
  };
  document.body.appendChild(el);
}
function renderSwingCard(c) {
  if (!c) return '<p class="ox-note">Sika couldn\'t read the swing play right now.</p>';
  const head = `<div class="sw-head"><b>Swing play</b><span class="ox-edu">Educational</span>${c.setup ? `<span class="sw-setup">${esc(c.setup)}</span>` : ""}${c.grade ? `<span class="sw-grade">${esc(c.grade)}</span>` : ""}</div>`;
  const asof = c.as_of ? `<p class="sw-foot">As of ${new Date(c.as_of).toLocaleString(undefined, {weekday: "short", month: "short", day: "numeric", hour: "numeric", minute: "2-digit"})}. For education only, not financial advice.</p>` : `<p class="sw-foot">For education only, not financial advice.</p>`;
  const ctx = (c.context || []).filter(x => !/IV crush/.test(x)).map(x => `<p class="sw-ctx">${esc(x)}</p>`).join("")   // Patch 191: the warning lives once, in Options
    + ((c.flow && Array.isArray(c.flow.lines) && c.flow.lines.length)      // Patch 182: the stored tape classification's line(s)

    const c = new Date(j.chain_as_of), ny = (d) => d.toLocaleString("en-US", {timeZone: "America/New_York", hour: "2-digit", minute: "2-digit", hour12: false});
    const day = (d) => d.toLocaleDateString("en-US", {timeZone: "America/New_York"});
    const now = new Date(), openPassed = ny(now) >= "09:30";
    const stale = day(c) !== day(now) || (openPassed && ny(c) < "09:30");
    when = `chain from ${ny(c)} ET${stale ? " — levels from before today's open" : ""} · Cboe, ~15 min delayed`;
  }
  return {text: `Next levels ${up} · ${dn} · ${exp} · ${reg}`, up, dn, exp, reg, regLong, when, n};
}
async function loadGexShelves() {
  const host = document.getElementById("gexShelves");
  if (!host) return;
  let j = null, error = "";
  try {
    const r = await fetch(`/api/gamma/${encodeURIComponent(SYM)}`);
    if (!r.ok) throw new Error(`Gamma request failed (${r.status})`);
    j = await r.json();
  } catch (e) {
    error = "Gamma data could not be loaded. Check the connection and refresh.";
  }
  const sh = j && j.shelves;
  const shelves = sh && Array.isArray(sh.shelves) ? sh.shelves : [];
  let shelfHtml = `<p class="scope">Watch-only gamma levels · no Lab record or alert</p>`;
  if (shelves.length) {
    const spot = sh.spot, rows = shelves;
    const money = v => "$" + Number(v).toLocaleString("en-US", {minimumFractionDigits: 2, maximumFractionDigits: 2});
    const fmtM = v => (Math.abs(Number(v)) / 1e6).toFixed(2) + "M";
    const pct = v => { const d = (v - spot) / spot * 100; return (d >= 0 ? "+" : "") + d.toFixed(1) + "%"; };
    const near = rows.reduce((a, b) => Math.abs(b.strike - spot) < Math.abs(a.strike - spot) ? b : a);
    const above = rows.filter(r => r.strike > near.strike).sort((a, b) => a.strike - b.strike)[0];
    const below = rows.filter(r => r.strike < near.strike).sort((a, b) => b.strike - a.strike)[0];
    const shelf = r => {
      const at = r.strike === near.strike;
      const both = r.side === "both";
      const lab = both ? "Both walls" : (r.side === "call" ? "Call wall" : "Put wall");
      const desc = both ? "Call and put gamma cancel here — the biggest two-sided wall." : (r.side === "call" ? "ceiling shelf" : "floor shelf");
      return `<div class="gex-shelf ${r.side}${at ? " at" : ""}"><span class="gex-bar"></span><span class="gex-mid"><b>${money(r.strike)}</b>${at ? ' <i class="gex-tag">PRICE HERE</i>' : ""}<small>${lab} &middot; ${desc}</small></span><span class="gex-right"><b>${r.gex >= 0 ? "+" : ""}${fmtM(r.gex)}</b><small>${at ? "at the price" : pct(r.strike) + (r.strike > spot ? " above" : " below")}</small></span></div>`;
    };
    const line = above && below
      ? `${SYM} is sitting nearest to its gamma shelf at ${money(near.strike)}. Above it, ${money(above.strike)} is the next shelf up; below it, ${money(below.strike)} is the floor.`
      : `${SYM} is sitting on its biggest gamma shelf at ${money(near.strike)}.`;
    shelfHtml = `<p class="scope">Swing expiry (monthly when available, 7+ days out) &middot; net gamma &middot; ${esc(sh.expiry)} &middot; watch-only</p><div class="gex-ladder">${rows.map(shelf).join("")}</div><p class="gex-sika"><b>Sika:</b> ${esc(line)}</p>`;
  } else {
    shelfHtml += `<p class="scope">Gamma shelf levels are unavailable for this ticker right now.</p>`;
  }
  const NL = gexNextLine(j);
  if (NL) shelfHtml += `<p class="gex-next"><b>${esc(NL.text)}</b><small>${esc(NL.regLong)} · the nearest strikes in each direction carrying at least ${Math.round((NL.n.share || 0.25) * 100)}% of the ${esc(NL.exp)} expiry's biggest gamma. Where a move tends to stop, not which way it goes.${NL.when ? " " + esc(NL.when) + "." : ""}</small></p>`;
  host.innerHTML = `<h2>GEX <em>shelves</em> + heat map</h2><div class="gex-shelf-layout"><section>${shelfHtml}</section><div id="gexHeatmap"></div></div>`;
  renderGexHeatmap(j, error);
}

// GEX heat map (Patch 137, watch-only): net gamma by strike and near-term expiry.
// White = positive gamma, red = negative gamma; stronger cells are brighter.
function renderGexHeatmap(j, message) {
  const host = document.getElementById("gexHeatmap");
  if (!host) return;
  const g = j && j.grid;
  if (!g || !g.rows || !g.rows.length || !g.expiries || !g.expiries.length) {
    host.innerHTML = `<div class="gex-map-head"><span class="t">GEX HEAT MAP</span><span class="s">CONFLUENCE</span></div><div style="padding:18px 14px;color:#A3A3A3;font-size:12px;line-height:1.5">${esc(message || "Options-chain gamma data is not available for this ticker right now. The heatmap will appear when Cboe chain data is available.")}</div>`;
    return;
  }
  const spot = g.spot;
  const maxV = Math.max(...g.rows.flatMap(r => (r.gross || r.gex).map(v => Math.abs(v))), 1);
  const nearStrike = g.rows.reduce((a, b) => Math.abs(b.strike - spot) < Math.abs(a.strike - spot) ? b : a).strike;
  // TOTAL notional per strike and strongest pull: largest absolute summed net GEX.
  // All expiries share the same spot multiplier, so the ranking is scale-invariant.
  const totals = g.rows.map(r => r.gex.reduce((a, b) => a + b, 0));
  const grossTotals = g.rows.map(r => (r.gross || []).reduce((a, b) => a + b, 0));
  const maxTotal = Math.max(...grossTotals.map(v => Math.abs(v)), 1);
  const strongestIdx = totals.reduce((bi, t, i) => Math.abs(t) > Math.abs(totals[bi]) ? i : bi, 0);
  const strongestStrike = g.rows[strongestIdx].strike;
  const fmt = v => (Math.abs(Number(v)) / 1e6).toFixed(2) + "M";
  const cell = (v, gv) => {
    const mag = Math.max(Math.abs(v), Math.abs(gv || 0));
    const a = Math.min(0.10 + 0.90 * mag / maxV, 1).toFixed(2);
    // Balanced cell: large gross, near-zero net — a pin. White (stabilise).
    if (Math.abs(v) < 0.25 * Math.abs(gv || 0) && Math.abs(gv || 0) > 0) return `<td style="background:rgba(255,255,255,${a});color:${a > 0.55 ? "#0A0A0A" : "#F3F4F6"}">${fmt(v)}</td>`;
    if (v > 0) return `<td style="background:rgba(255,255,255,${a});color:${a > 0.55 ? "#0A0A0A" : "#F3F4F6"}">${fmt(v)}</td>`;
    if (v < 0) return `<td style="background:rgba(220,38,38,${a});color:${a > 0.60 ? "#0A0A0A" : "#F87171"}">−${fmt(v)}</td>`;
    return `<td style="color:#6B7280">0</td>`;
  };
  const totalCell = (v, gv) => {
    const mag = Math.max(Math.abs(v), Math.abs(gv || 0));
    const a = Math.min(0.10 + 0.90 * mag / maxTotal, 1).toFixed(2);
    if (Math.abs(v) < 0.25 * Math.abs(gv || 0) && Math.abs(gv || 0) > 0) return `<td style="background:rgba(255,255,255,${a});color:${a > 0.55 ? "#0A0A0A" : "#F3F4F6"};font-weight:700">${fmt(v)}</td>`;
    if (v > 0) return `<td style="background:rgba(255,255,255,${a});color:${a > 0.55 ? "#0A0A0A" : "#F3F4F6"};font-weight:700">${fmt(v)}</td>`;
    if (v < 0) return `<td style="background:rgba(220,38,38,${a});color:${a > 0.60 ? "#0A0A0A" : "#F87171"};font-weight:700">−${fmt(v)}</td>`;
    return `<td style="color:#6B7280;font-weight:700">0</td>`;
  };
  const head = g.expiries.map(e => {
    const d = new Date(e + "T12:00:00");
    return `<th>${d.toLocaleDateString("en-US", {month:"short", day:"numeric"}).toUpperCase()}</th>`;
  }).join("");
  const nl = j && j.next_levels, nUp = nl && nl.next_up ? nl.next_up.strike : null, nDn = nl && nl.next_down ? nl.next_down.strike : null;
  const rowsHtml = g.rows.map((r, ri) => {
    const at = r.strike === nearStrike;
    const isStrongest = r.strike === strongestStrike;
    const nx = r.strike === nUp ? "↑" : r.strike === nDn ? "↓" : "";      // only marked when the row is already in the grid
    const cls = [at ? "spotrow" : "", isStrongest ? "strongest" : "", nx ? "nextrow" : ""].filter(Boolean).join(" ");
    return `<tr${cls ? ` class="${cls}"` : ""}><th>${r.strike}${at ? ' <span class="pricetag">PRICE</span>' : ""}${isStrongest ? ' <span class="pulltag">STRONGEST PULL</span>' : ""}${nx ? ` <span class="nexttag">NEXT ${nx}</span>` : ""}</th>${r.gex.map((v, i) => cell(v, (r.gross || [])[i])).join("")}${totalCell(totals[ri], grossTotals[ri])}</tr>`;
  }).join("");
  host.innerHTML = `<div class="gex-map-head"><span class="t">GEX HEAT MAP</span><span class="s">M = $1,000,000 · ${esc(g.expiries[0])} – ${esc(g.expiries[g.expiries.length - 1])} · TOTAL = sum across expiries</span></div><table class="gex-map"><thead><tr><th>STRIKE</th>${head}<th>TOTAL</th></tr></thead><tbody>${rowsHtml}</tbody></table><div class="gex-map-legend"><span><i class="sw w"></i>Positive — stabilise</span><span><i class="sw r"></i>Negative — chase</span><span><i class="sw r"></i>Strongest pull</span><span>Brighter = more gamma</span></div>`;
}
load();
</script>

// leave the chart: go back to wherever you came from in NextShelf, otherwise to Browse setups
function goBack(e) {
  if (e) e.preventDefault();
  let ref = "";
  try { ref = document.referrer ? new URL(document.referrer).origin : ""; } catch (_) {}
  if (ref === location.origin && history.length > 1) history.back();
  else location.href = "/app#discover";
  return false;
}
document.addEventListener("keydown", (e) => { if (e.key === "Escape") goBack(e); });

<script>
// ---- early access: while sign-ups are closed, every "Sign up" link becomes "Join the waitlist"
(function () {
  const LAND = false;
  const swap = (t) => {
    const s = t.trim(), arrow = /→\s*$/.test(s) ? " →" : "";
    if (/^(sign up|create)/i.test(s) || /free account|get started|free beta/i.test(s)) return (/^sign up$/i.test(s) ? "Join the waitlist" : "Join the waitlist") + arrow;
    if (/^sign up free to/i.test(s)) return "Join the waitlist" + arrow;
    return null;
  };
  function fix(root) {
    (root.querySelectorAll ? root : document).querySelectorAll('a[href="/login#signup"]').forEach(a => {
      if (a.dataset.wl) return; a.dataset.wl = 1;
      if (LAND) a.href = "#join";
      const n = [...a.childNodes].find(x => x.nodeType === 3 && x.textContent.trim());
      const t = n ? swap(n.textContent) : null; if (t) n.textContent = t + (n.textContent.endsWith(" ") ? " " : "");
    });
  }
  Promise.all([fetch("/auth/config").then(r => r.json()), fetch("/api/me").then(r => r.json()).catch(() => null)]).then(([c, me]) => {
    if (c.signups_open !== false || (me && !me.guest)) return;
    window.NS_WAITLIST = true; document.documentElement.classList.add("waitlist");
    fix(document);
    new MutationObserver(ms => ms.forEach(m => m.addedNodes.forEach(x => x.nodeType === 1 && fix(x.parentNode || x)))).observe(document.body, {childList: true, subtree: true});
  }).catch(() => {});
})();
</script>
<script>
/* The Waiting Room (Patch 178): a slow scene from somewhere in the world, a three-city guess. No score, no streaks.
   Poster first; the clip plays only while the card is on screen; reduced motion / save-data get a play button. */
const WR = { data: null, io: null };
function wrEsc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]); }
function wrLocalTime(tz) { try { return new Intl.DateTimeFormat([], {hour: "numeric", minute: "2-digit", timeZone: tz}).format(new Date()); } catch (e) { return ""; } }
async function renderWaitingRoom(host) {
  host = host || document.getElementById("waitingRoom"); if (!host) return;
  let d = null;
  try { const r = await fetch("/api/waiting-room", {credentials: "same-origin"}); if (r.status === 200) d = await r.json(); } catch (e) {}
  if (!d || !d.poster || !Array.isArray(d.options)) { host.hidden = true; host.innerHTML = ""; return; }
  WR.data = d;
  const day = new Date(d.date + "T12:00:00").toLocaleDateString([], {weekday: "short", month: "short", day: "numeric"});
  const calm = (window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches) || (navigator.connection && navigator.connection.saveData);
  host.innerHTML = `<div class="wr-eyebrow"><span>THE WAITING ROOM</span><span>${wrEsc(day)}</span></div>
    <div class="wr-window">
      <video class="wr-video" muted loop playsinline preload="none" poster="${wrEsc(d.poster)}" aria-label="A slow scene: ${wrEsc(d.hint)}"></video>
      <span class="wr-chip">TODAY'S WINDOW</span>
      ${d.video ? `<button class="wr-pause" type="button" aria-label="${calm ? "Play" : "Pause"}">${calm ? "▶" : "❚❚"}</button>` : ""}
    </div>
    <h3 class="wr-head">${wrEsc(d.headline)}</h3>
    <p class="wr-hint">${wrEsc(d.hint)}</p>
    <div class="wr-q">WHERE IN THE WORLD IS THE WAITING ROOM?</div>
    <div class="wr-game"></div>
    <div class="wr-foot"><span>A NEW WINDOW EVERY MORNING</span><span>Sound off, always</span></div>`;
  host.hidden = false;
  const v = host.querySelector(".wr-video"), btn = host.querySelector(".wr-pause");
  let manualPause = !!calm, loaded = false;
  const load = () => { if (loaded || !d.video) return; const s = document.createElement("source"); s.src = d.video; s.type = "video/mp4"; v.appendChild(s); v.load(); loaded = true; };
  const play = () => { if (!d.video || manualPause) return; load(); const p = v.play(); if (p && p.catch) p.catch(() => {}); };
  const pause = () => { try { v.pause(); } catch (e) {} };
  v.addEventListener("error", () => { if (btn) btn.remove(); }, true);
  if (btn) btn.onclick = () => { manualPause = !v.paused ? true : false; if (manualPause) { pause(); btn.textContent = "▶"; btn.setAttribute("aria-label", "Play"); } else { manualPause = false; play(); btn.textContent = "❚❚"; btn.setAttribute("aria-label", "Pause"); } };
  if (WR.io) WR.io.disconnect();
  if ("IntersectionObserver" in window && d.video) {
    WR.io = new IntersectionObserver(es => es.forEach(e => (e.isIntersecting && e.intersectionRatio >= .5 && !document.hidden) ? play() : pause()), {threshold: [0, .5, 1]});
    WR.io.observe(v);
  }
  document.addEventListener("visibilitychange", () => { if (document.hidden) pause(); });
  wrRenderGame(host, d.guessed || null, []);
}
function wrRenderGame(host, rev, wrong) {
  const g = host.querySelector(".wr-game"); if (!g) return;
  const d = WR.data;
  if (rev) {
    const t = wrLocalTime(rev.tz);
    g.innerHTML = `<div class="wr-reveal"><div class="wr-place">${rev.correct ? "✓ " : ""}${wrEsc(rev.city)}, ${wrEsc(rev.country)}${t ? " · " + wrEsc(t) : ""}${rev.scene_weather ? " · " + wrEsc(rev.scene_weather) : ""}</div>
      <p class="wr-cap">${wrEsc(rev.caption)}</p>${rev.credit ? `<p class="wr-credit">Video: ${wrEsc(rev.credit)}</p>` : ""}</div>`;
    return;
  }
  g.innerHTML = `<div class="wr-pills">${d.options.map(o => `<button type="button" class="wr-pill"${wrong.includes(o) ? " disabled" : ""}>${wrEsc(o)}</button>`).join("")}</div>
    <button type="button" class="wr-show">Just show me</button>`;
  g.querySelectorAll(".wr-pill").forEach(b => b.onclick = () => wrGuess(host, b.textContent, wrong));
  g.querySelector(".wr-show").onclick = () => wrGuess(host, "__reveal__", wrong);
}
async function wrGuess(host, choice, wrong) {
  try {
    const r = await fetch("/api/waiting-room/guess", {method: "POST", credentials: "same-origin", headers: {"Content-Type": "application/json"}, body: JSON.stringify({choice})});
    if (!r.ok) return;
    const x = await r.json();
    if (x.correct || choice === "__reveal__") wrRenderGame(host, x, wrong);
    else wrRenderGame(host, null, wrong.concat([choice]));
  } catch (e) {}
}
</script>
