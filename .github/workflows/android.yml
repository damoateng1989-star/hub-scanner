# NextShelf for Android (Trusted Web Activity) — built in the cloud, because the build workspace has no Android SDK.
# Every push that touches android/ (or a manual run from the Actions tab) produces:
#   • NextShelf-debug.apk  — install it on an Android phone to test (opens full screen: its key is in assetlinks.json)
#   • NextShelf-release.aab — the bundle for Google Play (signed with the upload key when the secrets below are set)
# Secrets for a signed release (Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_BASE64  base64 of the upload keystore (.jks)
#   ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
name: Android app

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Upload key (only when the secrets are set)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
          else
            echo "No upload key set: the release bundle will be unsigned."
          fi

      - name: Build
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleDebug bundleRelease

      - name: Name the outputs
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/NextShelf-debug.apk
          cp app/build/outputs/bundle/release/app-release.aab out/NextShelf-release.aab

      - uses: actions/upload-artifact@v4
        with:
          name: NextShelf-android-${{ github.run_number }}
          path: android/out/*
